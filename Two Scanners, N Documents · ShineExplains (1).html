<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Two Scanners, N Documents · ShineExplains</title>
<style>
:root{--bg:#0b1530;--card:#14234a;--tx:#fff;--mut:#9fb0d6;--y:#ffd23f;--g:#3ddc84;--r:#ff5d5d;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

@media(max-width:600px){body{font-size:15px}header{padding:8px 12px}.grid{padding:6px 10px 12px;gap:10px}.card{padding:12px}h2{font-size:19px}.big{font-size:20px}.bar{gap:6px;padding-left:6px;padding-right:6px}.bar button,.bar select{padding:8px 9px;font-size:14px;flex:1 1 auto}button{padding:8px 10px}input{width:72px}pre{font-size:12px}.vars{grid-template-columns:repeat(2,1fr)}.sc{min-width:100px}.doc{padding:6px 8px;font-size:12px}#stl{padding:4px 12px;font-size:13px}table{font-size:13px}td,th{padding:4px}}
.card{background:var(--card);border:1px solid #2a3f78;border-radius:14px;padding:16px;min-width:0}
h2{margin:0 0 8px;color:var(--y);font-size:22px}h3{margin:12px 0 6px;font-size:16px}
.mut{color:var(--mut)}.y{color:var(--y)}.g{color:var(--g)}.r{color:var(--r)}
.q{background:#2b2a12;border-left:4px solid var(--y);padding:10px 14px;border-radius:8px;margin:10px 0}
.after{display:none;background:#0e3a2a;border-left:4px solid var(--g);padding:10px 14px;border-radius:8px;margin:10px 0}.done .after{display:block}

button,select,input{font:inherit;border-radius:9px;border:1px solid #3a5199;background:#1b2f5e;color:#fff;padding:8px 12px}
button{cursor:pointer}button:hover{border-color:var(--y)}button.pri{background:var(--y);color:#111;border-color:var(--y);font-weight:700}
button.on{border-color:var(--g);background:#14503a}input{width:90px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;align-items:center}.row>button{max-width:100%;white-space:normal}.card{overflow-wrap:anywhere}pre,.tw{max-width:100%}
.bar{position:sticky;bottom:0;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));background:#0b1530ee;border-top:1px solid #2a3f78}

.scs{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}.sc{flex:1;min-width:130px;border-radius:10px;padding:10px;text-align:center;display:flex;flex-direction:column}
.sc.w{background:#f1f1f1;color:#111}.sc.d{background:#555}.sc small{opacity:.8}
.lanes{position:relative}.ph{position:absolute;top:0;bottom:0;width:2px;background:var(--y);z-index:3}

table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid #2a3f78;padding:5px 6px;text-align:right}.tw{overflow-x:auto;max-height:300px}

.cl2{white-space:pre;padding:0 6px;border-left:3px solid transparent}.ck{cursor:pointer}.ck:hover{background:#1b2f5e}.hl{background:#3a3410;border-left-color:var(--y)}
.vars{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.vars div{background:#0a1228;border-radius:8px;padding:6px;text-align:center;font-size:13px}.vars b{display:block;font-size:17px}
.chips span{margin:1px}.pill{display:inline-block;padding:2px 7px;border-radius:6px;font-size:12px;font-weight:700}.sw{background:#fff;color:#111}.sd{background:#555}
.ch{animation:in .6s both;margin:8px 0}@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1}}

</style></head><body>
<header><div class="brand">Shine<span>Explains</span> · Two Scanners, N Documents</div><div class="mut">Confusion to Intuition</div></header>
<div id="prog"><i id="pb"></i></div><div id="stl"></div>
<div class="grid" id="grid"><div class="card" id="lesson"></div><div class="card" id="simcard"><h3 class="y">Live scanner room</h3><div id="sim"></div></div></div>
<div class="bar"><button onclick="nav(-1)">◀ Previous</button><button class="pri" id="pp" onclick="tp()">▶ Play</button><button onclick="rs()">⟲ Reset</button><button onclick="nav(1)">Next ▶</button><select id="sp" onchange="speed=+this.value" title="Speed"><option value=".5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option></select></div>
<script>
const $=s=>document.getElementById(s),f=x=>Math.round(x*10)/10,DD={n:5,s1:2,s2:3};
let P={n:5,s1:2,s2:3},cur=0,speed=1,last=0,S={n:5,s1:2,s2:3,i:2,t:0,play:false,done:false,cb:null},tm=0,ev=new Set(),selK=0,hide=false,K=0,STS=[],auto=false;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function T(){return Math.max(S.i*S.s1,(S.n-S.i)*S.s2)}
function setSim(c,cb){Object.assign(S,c,{t:0,play:false,done:false,cb:cb||null});$('lesson').classList.remove('done');draw()}
function lane(k){const c=k?S.n-S.i:S.i,s=k?S.s2:S.s1,ax=Math.max(S.n*S.s1,S.n*S.s2,1),off=k?S.i:0,run=S.play||S.t>0;let b='',q=[],d=[],sc='';
for(let j=0;j<c;j++){const st=j*s,p=Math.min(1,Math.max(0,(S.t-st)/s)),nm='D'+(off+j+1);
b+=`<div class="blk${p>=1?' ok':''}" style="left:${st/ax*100}%;width:${s/ax*100}%"><i style="width:${p*100}%"></i><b>${nm}</b></div>`;
if(run&&S.t>=st+s)d.push(nm);else if(run&&S.t>=st)sc=nm;else q.push(nm)}
return `<div class="lh"><span><span class="pill ${k?'sd':'sw'}">Scanner ${k+1}</span> ${s} s/doc · ${c} doc${c==1?'':'s'}</span><span class="${S.done&&c?'g':'mut'}">${S.done?(c?'ends at '+c*s+' s':'idle'):''}</span></div><div class="tr">${b}</div><div class="st">${c?`Scanning: ${sc||'—'} · Queue: ${q.join(' ')||'—'} · Done: ${d.join(' ')||'—'}`:'Idle (0 documents)'}</div>`}
function draw(){const ax=Math.max(S.n*S.s1,S.n*S.s2,1);
$('sim').innerHTML=`<div class="lanes"><div class="ph" style="left:${Math.min(S.t/ax,1)*100}%"></div>${lane(0)}${lane(1)}</div><div class="clk">⏱ t = ${f(S.t)} s <span class="mut">(timeline 0–${ax} s)</span></div>`;
$('pp').textContent=cur==10?(auto?'⏸ Pause':K>0?'▶ Resume':'▶ Start'):S.play?'⏸ Pause':S.done?'↻ Replay':S.t>0?'▶ Resume':'▶ Play'}
function fin(){S.done=true;S.play=false;$('lesson').classList.add('done');S.cb&&S.cb()}
function tick(now){if(S.play){S.t+=Math.min(.1,(now-last)/1000)*speed*1.2;if(S.t>=T()){S.t=T();fin()}draw()}last=now;requestAnimationFrame(tick)}
function tp(){if(cur==10)return dgo();if(!ST[cur].sim)return;if(S.done){S.t=0;S.done=false;$('lesson').classList.remove('done');S.play=true}else S.play=!S.play;draw()}
function rs(){S.t=0;S.play=false;S.done=false;$('lesson').classList.remove('done');draw()}
function runCfg(n,i,note){setSim({n,i,s1:DD.s1,s2:DD.s2});if(note!=null)$('note').innerHTML=note;S.play=true;draw()}
function nav(d){const k=cur+d;if(k>=0&&k<ST.length)go(k)}
const chips=(a,b,n)=>Array.from({length:n},(_,j)=>`<span class="doc ${j<a?'s':'b'}">D${j+1}</span>`).join('');
const CODE=['int minTime(int n, int s1, int s2) {','    long long ans = LLONG_MAX;','','    for (int i = 0; i <= n; i++) {','        long long t1 = 1LL * i * s1;','        long long t2 = 1LL * (n - i) * s2;','','        ans = min(ans, max(t1, t2));','    }','','    return (int)ans;','}'],KEYS=[0,1,3,4,5,7,10];
const code=(hl,ck)=>CODE.map((l,k)=>{const c=ck&&KEYS.includes(k);return `<div class="cl2${k==hl?' hl':''}${c?' ck':''}"${c?` onclick="sel(${k})"`:''}>${esc(l)||' '}</div>`}).join('');
const FL=['What it does','Why it exists','Observation that led here','If removed or changed','Why it keeps us correct'];
const E={0:['Declares the function: n documents, s1 and s2 seconds per document on each scanner; it returns the minimum completion time.','These three numbers are the whole physical problem: how many documents, how fast each scanner is.','The desk: 5 documents, Scanner 1 at 2 s, Scanner 2 at 3 s.','Drop s2 and Scanner 2 has no speed; we could not compute any time at all.','The inputs fully describe every possible way of sharing the work.'],
1:['Creates ans, our best (smallest) completion time found so far.','Before the loop, no distribution has been checked. We need a start value bigger than any real time, so the first real result always wins.','In the six-row table we kept the smallest total as we went.','Start ans at 0 and min() could never replace it: the answer would always be 0, which is wrong.','LLONG_MAX is not a real completion time. It is only an initial upper bound.'],
3:['Tries every i from 0 to n. i = documents given to Scanner 1; Scanner 2 automatically gets n - i.','Only counts matter, so n+1 values of i cover every distribution.','The six cards: 0/5, 1/4 … 5/0. i = 0,1,2,3,4,5.','i < n would skip “all documents to Scanner 1”. Starting at 1 would skip “Scanner 1 gets none”. Both are valid.','Every distribution is visited exactly once; none is missed.'],
4:['Scanner 1 time t1 = i × s1.','It handles its i documents one after another, s1 seconds each, with no gaps (Rules B and C).','Sequential processing on one scanner. For i = 3: t1 = 3 × 2 = 6 s.','Without t1 we cannot know when Scanner 1 finishes. 1LL makes the multiplication happen in long long, so int never overflows midway.','The time for Scanner 1 is exactly count × time per document.'],
5:['Scanner 2 time t2 = (n - i) × s2.','Every document goes to exactly one scanner, so Scanner 2 gets what Scanner 1 did not take.','For i = 3: t2 = (5 - 3) × 3 = 6 s.','Using n × s2 would count documents twice; using i × s2 would mix up the scanners.','Together i + (n - i) = n: no document is lost or duplicated.'],
7:['max(t1, t2): the time this distribution needs. min(ans, …): keep the best distribution so far.','max: scanners run simultaneously, so the job ends only when the LATER one finishes. min: each distribution gives one finishing time and we want the smallest.','Stage 5: 4 s and 9 s → 9, not 13. Stage 9: compare 15, 12, 9, 6, 8, 10 → 6.','Swap them (min of t1, t2 then max over i) and you reward a distribution for the scanner that finishes early. Using t1 + t2 wrongly adds parallel work.','Per distribution we compute its true finish time; across distributions we keep the smallest.'],
10:['Returns ans, the smallest completion time found.','After every distribution has been checked, ans cannot be improved.','The “MINIMUM TIME” we highlighted in the table.','Return inside the loop and we would stop after the first distribution.','(int) is fine only if constraints guarantee the answer fits in int; otherwise make the return type long long.']};
function sel(k){selK=k;$('code').innerHTML=code(k,1);$('ex').innerHTML=E[k].map((t,j)=>`<p><b class="y">${FL[j]}:</b> ${t}</p>`).join('')}
function nextLine(){sel(KEYS[(KEYS.indexOf(selK)+1)%7])}
function cyc(){setSim({n:DD.n,s1:DD.s1,s2:DD.s2,i:(S.i+1)%(DD.n+1)});S.play=true}
function runCase(i){setSim({n:DD.n,s1:DD.s1,s2:DD.s2,i},()=>{ev.add(i);const a=i*2,b=(5-i)*3;$('det').innerHTML=`Scanner 1: ${i} × 2 = ${a} s · Scanner 2: ${5-i} × 3 = ${b} s → we wait for the later one: MAX(${a}, ${b}) = <b class="y">${Math.max(a,b)} s</b>`;tbl()});S.play=true;draw();document.querySelectorAll('.cd').forEach((e,k)=>e.classList.toggle('on',k==i))}
function nextRow(){for(let i=0;i<=5;i++)if(!ev.has(i))return runCase(i)}
function tbl(){const all=ev.size==6;let h='<tr><th>S1</th><th>S2</th><th>S1 time</th><th>S2 time</th><th>Total</th></tr>';
for(let i=0;i<=5;i++){const a=i*2,b=(5-i)*3,m=Math.max(a,b),e=ev.has(i);h+=`<tr class="${all&&m==6?'best':''}"><td>${i}</td><td>${5-i}</td><td>${e?a:'?'}</td><td>${e?b:'?'}</td><td>${e?m+' sec':'?'}</td></tr>`}
$('tb').innerHTML=h;$('fin').innerHTML=all?`<div class="after" style="display:block"><b>All six evaluated:</b> 15, 12, 9, 6, 8, 10. We want the smallest overall completion time among all valid distributions.<div class="big g">MINIMUM TIME = 6 SECONDS</div>Two different decisions: <b>within</b> a distribution we wait for the later scanner (max). <b>Across</b> distributions we pick the smallest (min).</div>`:`<p class="mut">${ev.size}/6 rows evaluated. The best row is only highlighted once all six are done.</p>`}
function a13(){$('fb').innerHTML='<div class="bad">Not quite: the scanners run at the same time. Replay and watch: while Scanner 1 finishes at 4 s, Scanner 2 is still working until 9 s. Times that overlap are not added.</div>'}
function a9(){$('fb').innerHTML='<div class="after" style="display:block"><b>Yes, 9 s.</b> The job ends only when both scanners are finished, so we wait for the later one. For this distribution: completion time = the later of the two finishing times.</div>'}
function mv(){setSim({n:5,s1:2,s2:3,i:3});S.play=true;draw()}
/* dry run */
function build(){const{n,s1,s2}=P;let a=null,o=[{ln:1,v:{ans:'LLONG_MAX'},t:'ans starts at LLONG_MAX: an upper bound, not a real time. Nothing has been checked yet.'}],v={ans:'LLONG_MAX'},best=-1,bm=1e18;
for(let i=0;i<=n;i++){const m=Math.max(i*s1,(n-i)*s2);if(m<bm){bm=m;best=i}}
for(let i=0;i<=n;i++){const t1=i*s1,t2=(n-i)*s2,m=Math.max(t1,t2),old=a;a=a===null?m:Math.min(a,m);
v={i,'n-i':n-i,t1:'–',t2:'–',max:'–',ans:old===null?'LLONG_MAX':old};o.push({ln:3,it:i,v:{...v},t:`Iteration ${i+1}: i = ${i}. Scanner 1 gets ${i} doc(s), Scanner 2 gets ${n-i}.`});
v.t1=t1;o.push({ln:4,it:i,v:{...v},t:`t1 = ${i} × ${s1} = ${t1} s. Scanner 1 works its documents one after another.`});
v.t2=t2;o.push({ln:5,it:i,v:{...v},t:`t2 = (${n} - ${i}) × ${s2} = ${t2} s.`});
v.max=m;v.ans=a;o.push({ln:7,it:i,v:{...v},t:`max(${t1}, ${t2}) = ${m}: we wait for the later scanner. ans = min(${old===null?'LLONG_MAX':old}, ${m}) = ${a}. `+(old===null||m<old?'Improved: new best.':`${m} is worse than the ${old} already found, so ans stays ${old}.`)+(i==best?' ⭐ This is the optimal distribution.':'')})}
o.push({ln:3,v:{...v},t:`i becomes ${n+1}; ${n+1} <= ${n} is false, so the loop ends.`});o.push({ln:10,v:{...v},t:`Return ${a}.`,out:a});return o}
function ds(k){K=Math.max(0,Math.min(STS.length-1,k));const s=STS[K];$('code').innerHTML=code(s.ln,0);
$('vars').innerHTML=['i','n-i','t1','t2','max','ans'].map(x=>`<div>${x}<b class="${x=='ans'?'y':''}">${s.v[x]===undefined?'–':s.v[x]}</b></div>`).join('');
$('dx').style.display=hide?'none':'block';$('dx').innerHTML=s.t+(s.out!==undefined?`<pre>${s.out}</pre>`:'')+`<div class="mut">Step ${K+1}/${STS.length}</div>`;
if(s.it!==undefined&&(s.ln==3||S.i!==s.it)){setSim({...P,i:s.it});if(s.ln==3){S.play=true}else{S.t=T();fin()}draw()}}
function dnext(){ds(K+1)}function dprev(){ds(K-1)}
function inext(){for(let k=K+1;k<STS.length;k++)if(STS[k].ln==3){return ds(k)}ds(STS.length-1)}
function iprev(){for(let k=K-1;k>=0;k--)if(STS[k].ln==3)return ds(k);ds(0)}
function dgo(){auto=!auto;$('da').textContent=auto?'⏸ Pause':K>0?'▶ Resume':'▶ Start dry run';draw();if(auto)loop()}
function loop(){clearTimeout(tm);if(!auto)return;if(K>=STS.length-1){auto=false;$('da').textContent='▶ Start dry run';draw();return}tm=setTimeout(()=>{dnext();loop()},1500/speed)}
function dreset(){auto=false;clearTimeout(tm);$('da').textContent='▶ Start dry run';ds(0)}
function dhide(){hide=!hide;$('dh').textContent=hide?'Show explanation':'Hide explanation';ds(K)}
/* playground */
function pg(a){if(a){$('pn').value=a[0];$('p1').value=a[1];$('p2').value=a[2]}
const n=+$('pn').value,x=+$('p1').value,y=+$('p2').value,e=$('pe');
if(!Number.isInteger(n)||n<0||n>60)return e.textContent='Documents n must be a whole number from 0 to 60 (kept small so the animation stays readable).';
if(!Number.isInteger(x)||!Number.isInteger(y)||x<1||y<1||x>1000||y>1000)return e.textContent='Scanner speeds must be whole seconds from 1 to 1000 (zero or negative speeds are impossible).';
e.textContent='';P={n,s1:x,s2:y};let h='<tr><th>S1</th><th>S2</th><th>S1 time</th><th>S2 time</th><th>Total</th></tr>',best=0,bm=Infinity;
for(let i=0;i<=n;i++){const m=Math.max(i*x,(n-i)*y);if(m<bm){bm=m;best=i}}
for(let i=0;i<=n;i++){const a=i*x,b=(n-i)*y;h+=`<tr class="cl${i==best?' best':''}" onclick="setSim({...P,i:${i}});S.play=true"><td>${i}</td><td>${n-i}</td><td>${a}</td><td>${b}</td><td>${Math.max(a,b)}</td></tr>`}
$('pt').innerHTML=h;$('pa').innerHTML=`<div class="after" style="display:block">Answer: <b class="y">${bm} seconds</b>. Best split: Scanner 1 takes ${best} (${best*x} s), Scanner 2 takes ${n-best} (${(n-best)*y} s). We wait for the later one, then pick the smallest total over every i. The rows around the best one are not better. The dry-run stage now uses these inputs.</div>`;
setSim({...P,i:best});S.play=true;draw()}
const EX=[['A · S1 much faster',[10,1,10]],['B · equal speeds',[6,3,3]],['C · S2 faster',[5,3,2]],['D · one document',[1,2,3]],['E · many documents',[50,2,3]]];
const MIS=[['Scanner 1 is faster, so it should get every document.','Not necessarily. Sharing with Scanner 2 can cut the time (10 s became 6 s).'],['S1 takes 4 s and S2 takes 9 s, so total = 13 s.','They work simultaneously. Total is 9 s.'],['Always divide documents equally.','Speeds differ, so equal division is not always optimal.'],['Ignore cases where one scanner gets zero documents.','Those are valid distributions (i = 0 and i = n) and must be included.'],['Try every assignment of individual documents.','Same time per document on a scanner, so only counts matter: n+1 cases, not 2ⁿ.'],['Max and min are just formulas to remember.','Max = wait for both parallel scanners. Min = choose the best valid distribution.']];
const ST=[
{t:'Meet the documents and scanners',h:()=>`<h2>Meet the documents and scanners</h2><p>We have <b>n</b> documents and two scanners. Each scanner needs a fixed time to scan one document. They can work <b>at the same time</b>, each handles one document at a time, and each can start its next document immediately.</p><div class="desk"><div>${chips(0,0,5).replace(/b"/g,'"')}</div><div class="scs"><div class="sc w">🖨️<b>Scanner 1</b><small>2 seconds per document</small></div><div class="sc d">🖨️<b>Scanner 2</b><small>3 seconds per document</small></div></div></div><div class="q">How can we scan all five documents in the minimum possible time?</div><p class="mut">Stop and think before you continue: which scanner would you use? Both? How many documents would each get?</p>`},
{t:'How one scanner works',sim:()=>({n:1,i:1,s1:2,s2:3}),h:()=>`<h2>How one scanner works</h2><p>Watch one document enter, get scanned while the timer runs, and leave.</p><div class="row"><button class="pri" onclick="runCfg(1,1)">Scan D1 on Scanner 1</button><button class="pri" onclick="runCfg(1,0)">Scan D1 on Scanner 2</button></div><div class="after">Scanner 1 needs 2 s per document, Scanner 2 needs 3 s. So Scanner 1 is faster. But faster does <b>not</b> automatically mean it should take every document. Hold that thought.</div>`},
{t:'The three rules',sim:()=>({n:3,i:1,s1:2,s2:3}),h:()=>`<h2>The three operating rules</h2><div class="row"><button onclick="runCfg(2,1,'<b>Rule A:</b> both scanners start at 0 and run side by side. Neither waits for the other.')">Rule A: simultaneous</button><button onclick="runCfg(3,3,'<b>Rule B:</b> one document at a time. D2 and D3 wait in the queue until D1 is done.')">Rule B: one at a time</button><button onclick="runCfg(3,0,'<b>Rule C:</b> D1 ends at 3 s and D2 starts at exactly 3 s. No idle gap.')">Rule C: no gap</button></div><div class="q" id="note">Pick a rule and press the button.</div><div class="after"><b>Same scanner = one after another. Different scanners = at the same time.</b> Keep this distinction clear.</div>`},
{t:'Everything to the faster scanner',sim:()=>({...DD,i:5}),h:()=>`<h2>First instinct: all five to Scanner 1</h2><p>Scanner 1 is faster, so give it D1 to D5 and leave Scanner 2 idle. Press Play.</p><div class="after">D1: 0–2, D2: 2–4, D3: 4–6, D4: 6–8, D5: 8–10.<br>5 × 2 = 10 seconds.<div class="big y">TOTAL TIME = 10 SECONDS</div>A valid distribution, but is it the best? <b>Could we do better by using Scanner 2 as well?</b></div>`},
{t:'Divide the work',sim:()=>({...DD,i:2}),h:()=>`<h2>Divide the work</h2><p>Scanner 1 gets D1, D2 (2 documents). Scanner 2 gets D3, D4, D5 (3 documents). Both start at time 0. Press Play.</p><div class="after">Scanner 1 finishes at 4 s. Scanner 2 finishes at 9 s.<div class="q">Is the total time 4 + 9 = 13 seconds?</div><div class="row"><button onclick="a13()">13 seconds</button><button onclick="a9()">9 seconds</button></div><div id="fb"></div></div>`},
{t:'Is 9 the minimum?',sim:()=>({...DD,i:2}),h:()=>`<h2>How do we know 9 is the minimum?</h2><p>Move one document from Scanner 2 to Scanner 1 and see what happens.</p><div class="row"><button class="pri" onclick="mv()">Move one document: 2/3 → 3/2</button></div><div class="after">Scanner 1: 3 × 2 = 6 s. Scanner 2: 2 × 3 = 6 s. Both finish together.<div class="big g">TOTAL TIME = 6 SECONDS</div>2/3 gave 9 s, 3/2 gave 6 s. <b>Can another distribution be even better?</b> To be sure, we should check them all.</div>`},
{t:'Why counts are enough',sim:()=>({...DD,i:0}),h:()=>`<h2>Why checking every distribution is enough</h2><p>Every document goes to exactly one scanner. If Scanner 1 gets <b>i</b> documents, Scanner 2 gets the remaining <b>n − i</b>, because i + (n − i) = n.</p><p>We do <b>not</b> need to track which document goes where: Scanner 1 takes 2 s for every document, whether it is D1 or D5. Only the <b>number</b> assigned matters.</p><div class="row"><button class="pri" onclick="cyc()">Show next split</button></div>${[0,1,2,3,4,5].map(i=>`<div class="chips"><span class="mut">S1:${i} · S2:${5-i}</span> ${chips(i,0,5)}</div>`).join('')}<p class="mut">Yellow = Scanner 1, grey = Scanner 2. Six possible distributions; no document is ever lost or duplicated.</p>`},
{t:'Six-case simulation',sim:()=>({...DD,i:0}),cb:1,h:()=>`<h2>Try all six distributions</h2><p>Pick a card (or reveal the next row) and watch it run.</p><div class="row">${[0,1,2,3,4,5].map(i=>`<button class="cd" onclick="runCase(${i})">S1: ${i} · S2: ${5-i}</button>`).join('')}<button class="pri" onclick="nextRow()">Reveal next row</button></div><div class="q" id="det">Run a case to see both scanners’ individual times.</div><div class="tw"><table id="tb"></table></div><div id="fin"></div>`},
{t:'The formula, discovered',h:()=>`<h2>Now give the observations names</h2><p>n = total documents · i = documents for Scanner 1 · n − i = documents for Scanner 2.</p><p>Scanner 1’s time: <b class="y">i × s1</b>. Scanner 2’s time: <b class="y">(n − i) × s2</b>.</p><div class="q"><b>Decision 1 (one distribution):</b> both work at once, so we wait for the later one: <b>MAX(i × s1, (n − i) × s2)</b>.</div><div class="q"><b>Decision 2 (all distributions):</b> test every i from 0 to n and keep the smallest: <b>MIN over i = 0…n of MAX(i × s1, (n − i) × s2)</b>.</div><p>For n = 5, s1 = 2, s2 = 3 the six results are 15, 12, 9, 6, 8, 10, and the minimum is <b class="g">6</b>. This is not something to memorize. It is just what we already did with the scanners, written down.</p>`},
{t:'The C++ code, line by line',h:()=>`<h2>The code, line by line</h2><p class="mut">Tap any highlighted line, or use the button.</p><pre id="code"></pre><div class="row"><button onclick="nextLine()">Next line ▶</button></div><div id="ex"></div>`,init:()=>sel(selK)},
{t:'Dry run: the real loop',sim:()=>({...P,i:0}),h:()=>`<h2>Dry run (n=${P.n}, s1=${P.s1}, s2=${P.s2})</h2><div class="row"><button class="pri" id="da" onclick="dgo()">▶ Start dry run</button><button onclick="dreset()">Reset</button><button onclick="dprev()">◀ Step</button><button onclick="dnext()">Step ▶</button><button onclick="iprev()">◀ Iteration</button><button onclick="inext()">Iteration ▶</button><button id="dh" onclick="dhide()">${hide?'Show':'Hide'} explanation</button></div><pre id="code"></pre><div class="vars" id="vars"></div><div class="q" id="dx"></div><p class="mut">Speed uses the 0.5x / 1x / 2x selector below. Change inputs in the playground to dry-run other cases.</p>`,init:()=>{auto=false;clearTimeout(tm);STS=build();ds(0)}},
{t:'Why it is correct',h:()=>`<h2>Why this is correct</h2><div class="ch card" style="animation-delay:0s"><b class="y">1. Every distribution is considered.</b><br>Scanner 1 can get any whole number of documents 0…n, Scanner 2 gets the rest. The loop tries all of them.</div><div class="ch card" style="animation-delay:.9s"><b class="y">2. Each time is computed correctly.</b><br>Each scanner works sequentially: count × time per document. They run together, so the distribution ends at the MAX of the two.</div><div class="ch card" style="animation-delay:1.8s"><b class="g">3. The best one is returned.</b><br>We compare every distribution’s finishing time and keep the smallest, so after the loop ans is the minimum possible.</div><button onclick="go(cur)">↻ Replay</button>`},
{t:'Complexity',h:()=>`<h2>Complexity</h2><p>i takes the values 0, 1, 2, …, n: that is <b>n + 1</b> iterations. Each does a constant amount of arithmetic and comparison.</p><div class="big y">Time O(n) · Space O(1)</div><p>We only keep ans, i, t1, t2: a fixed number of variables, no array that grows with n. The five-document animation is only a visualization, not memory the algorithm uses.</p>`},
{t:'Playground',sim:()=>({...P,i:0}),h:()=>`<h2>Experiment</h2><div class="row">n <input id="pn" type="number" value="${P.n}"> s1 <input id="p1" type="number" value="${P.s1}"> s2 <input id="p2" type="number" value="${P.s2}"><button class="pri" onclick="pg()">Run Simulation</button></div><div class="bad" id="pe" style="display:none"></div><div class="row">${EX.map((e,k)=>`<button onclick="pg(EX[${k}][1])">${e[0]}</button>`).join('')}</div><div id="pa"></div><div class="tw"><table id="pt"></table></div><p class="mut">Tap a row to replay that distribution. Every experiment uses the same reasoning: wait for the later scanner, then pick the best split.</p>`,init:()=>{const e=$('pe');new MutationObserver(()=>{e.style.display=e.textContent?'block':'none'}).observe(e,{childList:true,characterData:true,subtree:true});pg()}},
{t:'Let’s remove the confusion',h:()=>`<h2>Let’s remove the confusion</h2>${MIS.map(m=>`<div class="bad">❌ ${m[0]}</div><div class="after" style="display:block">✔ ${m[1]}</div>`).join('')}`},
{t:'Summary',h:()=>`<h2>Final summary</h2>${['Understand the machines.','Understand the parallel processing.','Experiment with different allocations.','Find each distribution’s completion time.','Compare all distributions.','Choose the minimum.'].map((s,k)=>`<div class="ch" style="animation-delay:${k*.6}s">${k+1}. ${s}</div>`).join('')}<pre>t1 = i * s1;\nt2 = (n - i) * s2;\n\nans = min(ans, max(t1, t2));</pre><p>This code is simply the programming translation of the physical reasoning you already discovered.</p><div class="big y">Don’t memorize the solution. Understand why it works.</div><div class="big">SHINEEXPLAINS<br><span class="g">Confusion se Intuition Tak.</span></div>`}];
function go(k){cur=k;auto=false;clearTimeout(tm);const s=ST[k];$('lesson').className='card';$('lesson').innerHTML=s.h();$('simcard').style.display=s.sim?'':'none';$('pp').style.display=s.sim?'':'none';$('grid').className='grid'+(s.sim?'':' one');
if(s.sim){setSim(s.sim(),k==7?()=>{}:null);if(k==7){S.cb=null;ev=new Set();tbl()}}
s.init&&s.init();$('pb').style.width=(k+1)/ST.length*100+'%';$('stl').textContent=`Stage ${k+1} of ${ST.length}: ${s.t}`;draw();window.scrollTo(0,0)}
requestAnimationFrame(tick);go(0);
</script></body></html>
